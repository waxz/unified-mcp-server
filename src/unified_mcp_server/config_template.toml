# unified-mcp-server configuration.
# Generated by `unified-mcp-server --init-config`; edit as needed.
# Use it with:  unified-mcp-server -c config.toml
# Precedence: built-in defaults -> this file -> command-line flags.
#
# TOML note: every top-level key must come before the first [table] header,
# otherwise it belongs to that table and is ignored.

# ---- server -------------------------------------------------------------------
# TRANSPORT = "http"           # "stdio" (default) or "http"; or use -t
HOST = "127.0.0.1"             # use 0.0.0.0 only behind auth/TLS
PORT = 8000
PATH = "/mcp"
# PUBLIC_URL = "https://mcp.example.com"   # base URL for patch-preview links

# Checked on every tool call over HTTP (ignored for stdio). Comma-separated.
# Clients send "Authorization: Bearer <key>" or "x-api-key: <key>".
# This key was generated for you; keep this file private.
API_KEYS = "__API_KEY__"

# ---- shell tools --------------------------------------------------------------
COMMAND_TIMEOUT = 30           # seconds; raise it for long builds
SAFETY_MODE = "strict"         # "strict" forces bash for untrusted commands
# true when this server itself runs inside a container: commands run directly.
IS_IN_DOCKER = false

# How a command that isn't in TRUSTED_COMMANDS is sandboxed:
#   "none"        ask you to approve it (the default; see below)
#   "bubblewrap"  run it in a bubblewrap sandbox: the whole filesystem
#                 read-only except the project dir, private /tmp, own
#                 namespaces. Linux only; needs the `bubblewrap` package.
#   "docker"      run it in a throwaway `docker run --rm` container with only
#                 the project dir mounted. Needs a Docker daemon.
#   "drun"        hand off to a `drun` function you define in ~/.bashrc (legacy)
# SANDBOX = "bubblewrap"
# SANDBOX_NETWORK = "allow"       # or "none" to cut network inside the sandbox
# SANDBOX_DOCKER_IMAGE = "debian:stable-slim"   # for SANDBOX = "docker"
# Let tmux_send_keys type into host (native_mcp_*) tmux sessions. Off by
# default: a client could then run any command on this machine, bypassing
# TRUSTED_COMMANDS.
ALLOW_HOST_TMUX_INPUT = false
# A command that isn't in TRUSTED_COMMANDS (and no sandbox is configured) can
# still run if you approve it: in your MCP client when it shows prompts, or on
# the approvals dashboard, whose link this server prints in its log at startup
# (HTTP only; the model never sees it). Answers: allow once, allow until
# restart, or deny.
APPROVE_UNTRUSTED = true
APPROVAL_TIMEOUT = 600         # seconds a request stays open before it's denied
APPROVAL_WAIT = 25             # seconds one tool call waits before saying "pending"
# Fixed token for the approvals dashboard link, so it stays the same across
# restarts (otherwise a new random one each start). Treat it like a password.
# APPROVALS_DASHBOARD_TOKEN = "change-me-to-a-long-random-string"

# Files/folders the file tools must never read, list, search or write.
# This config file is always protected (it holds API_KEYS).
# PROTECTED_PATHS = [".env", "secrets"]

# ---- tool families --------------------------------------------------------------
[UNIFIED]
namespaced = false             # true -> tools are named fs_* and shell_*
enable_files = true
enable_shell = true

# ---- project directory and allowed roots (file tools) ---------------------------
# work_dir is the project directory (-w overrides it). Relative entries in
# allow_directories resolve against work_dir. Tools can't reach outside them.
[CONFIG.linux]
work_dir = "."
allow_directories = ["."]

[CONFIG.macos]
work_dir = "."
allow_directories = ["."]

[CONFIG.windows]
work_dir = "."
allow_directories = ["."]

# ---- trusted commands -----------------------------------------------------------
# Run directly on the host, by name: execute_command(command="t_test", cwd=".").
# cwd "." is the project directory. Add one table per command.
# [TRUSTED_COMMANDS.t_test]
# command = "pytest -q"
# shell = "bash"
# cwd = "."
# description = "run the test suite"

# ---- sandbox (optional) ---------------------------------------------------------
# Without host_root, shell tools share the file tools' project directory and
# follow set_project_directory.
# [DOCKER_CONFIG.linux]
# host_root = "/home/me/projects/repo"
# work_dir = "/app/dev/repo"             # path inside the sandbox container
# allow_directories_host = ["."]
# allow_directories_docker = [".", "/tmp"]
