# unified-mcp-server configuration.
# Generated by `unified-mcp-server --init-config`; edit as needed.
# Use it with:  unified-mcp-server -c config.toml
# Precedence: built-in defaults -> this file -> command-line flags.
#
# TOML note: every top-level key must come before the first [table] header,
# otherwise it belongs to that table and is ignored.

# ---- server -------------------------------------------------------------------
# TRANSPORT = "http"           # "stdio" (default) or "http"; or use -t
HOST = "127.0.0.1"             # use 0.0.0.0 only behind auth/TLS
PORT = 8000
PATH = "/mcp"
# PUBLIC_URL = "https://mcp.example.com"   # base URL for patch-preview links

# Checked on every tool call over HTTP (ignored for stdio). Comma-separated.
# Clients send "Authorization: Bearer <key>" or "x-api-key: <key>".
# This key was generated for you; keep this file private.
API_KEYS = "__API_KEY__"

# ---- shell tools --------------------------------------------------------------
COMMAND_TIMEOUT = 30           # seconds; raise it for long builds
SAFETY_MODE = "strict"         # "strict" forces bash for untrusted commands
# true when this server itself runs inside a container: commands run directly.
# false on a host: only TRUSTED_COMMANDS run directly; anything else needs the
# `drun` sandbox helper.
IS_IN_DOCKER = false

# ---- tool families --------------------------------------------------------------
[UNIFIED]
namespaced = false             # true -> tools are named fs_* and shell_*
enable_files = true
enable_shell = true

# ---- project directory and allowed roots (file tools) ---------------------------
# work_dir is the project directory (-w overrides it). Relative entries in
# allow_directories resolve against work_dir. Tools can't reach outside them.
[CONFIG.linux]
work_dir = "."
allow_directories = ["."]

[CONFIG.macos]
work_dir = "."
allow_directories = ["."]

[CONFIG.windows]
work_dir = "."
allow_directories = ["."]

# ---- trusted commands -----------------------------------------------------------
# Run directly on the host, by name: execute_command(command="t_test", cwd=".").
# cwd "." is the project directory. Add one table per command.
# [TRUSTED_COMMANDS.t_test]
# command = "pytest -q"
# shell = "bash"
# cwd = "."
# description = "run the test suite"

# ---- sandbox (optional) ---------------------------------------------------------
# Without host_root, shell tools share the file tools' project directory and
# follow set_project_directory.
# [DOCKER_CONFIG.linux]
# host_root = "/home/me/projects/repo"
# work_dir = "/app/dev/repo"             # path inside the sandbox container
# allow_directories_host = ["."]
# allow_directories_docker = [".", "/tmp"]
